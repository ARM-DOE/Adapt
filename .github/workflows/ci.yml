name: Continuous Integration

on:
  schedule:
    - cron: "0 9 * * *"  # daily at 09Z
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}-py${{ matrix.python-version }}
    if: github.repository == 'ARM-DOE/Adapt'
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu, macOS, windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for setuptools_scm version tag detection

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          init-shell: bash
          cache-downloads: true
          post-cleanup: "all"

      - name: Fetch all history for all tags and branches
        run: |
           git fetch --prune

      - name: Install adapt
        run: pip install -e . --no-deps --force-reinstall

      - name: Install ruff
        run: pip install ruff

      - name: Install import-linter
        run: pip install import-linter

      - name: Install mypy
        run: pip install mypy

      - name: Show environment info
        run: |
          python --version
          pip list | head -n 30

      - name: Lint with ruff
        run: ruff check src tests

      - name: Check import architecture
        run: lint-imports --no-cache

      - name: Type-check with mypy
        run: mypy src/adapt

      - name: Run tests
        run: |
          pytest -m "not integration" \
            --cov=src/adapt \
            --cov-report=term \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
