name: Deploy Docs

on:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    # Forks carry no release tags, so setuptools_scm cannot resolve a version
    # here — and a fork has no business publishing to its own gh-pages.
    if: github.repository == 'ARM-DOE/Adapt'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for setuptools_scm version tag detection

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Fetch all history for all tags and branches
        run: |
           git fetch --prune

      - name: Install doc dependencies
        run: |
          pip install sphinx>=7.0 pydata-sphinx-theme>=0.15 \
                      sphinx-autodoc-typehints myst-parser>=2.0
          pip install --no-deps -e .

      - name: Build HTML docs
        run: sphinx-build -b html docs docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
